<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>
Log in - Pocket Smart AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body>
<header class="nav"><a class="brand" href="{{ url_for('index') }}">Pocket <b>Smart</b> AI</a></header>
<main><div class="auth card"><h2>Log in</h2>{% with m = get_flashed_messages(with_categories=true) %}{% for c, t in m %}<div class="flash {{ c }}" role="status">{{ t }}</div>{% endfor %}{% endwith %}
<form method="post"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="btn" type="submit">Log in</button></form>
<p class="muted" style="margin-top:1rem">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></main>
<footer>Pocket Smart AI - plan first, spend smarter.</footer></body></html>
